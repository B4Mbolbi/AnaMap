<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитическая карта реальности (Vanilla JS)</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Собственные стили -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/tags.css">
    <link rel="stylesheet" href="css/panels.css">
    <link rel="stylesheet" href="css/scrollbar.css">
</head>

<body>

    <!-- Шапка -->
    <header>
        <div class="logo">
            <div class="logo-icon">M</div>
            <div class="title">
                <h1>Аналитическая карта реальности</h1>
                <p>data-first monitoring dashboard</p>
            </div>
        </div>
        <div class="header-right">
            <div class="badge">
                <div class="dot"></div>
                <span id="event-count">0 событий</span>
            </div>
            <button id="btn-add-event" class="btn-primary">+ Добавить</button>
        </div>
    </header>

    <!-- Основной контент -->
    <div class="main-container">
        <!-- Сайдбар с вертикальными вкладками -->
        <aside class="sidebar">
            <!-- Вертикальные табы -->
            <nav class="sidebar-tabs" id="sidebar-tabs">
                <button class="sidebar-tab active" data-panel="filters" title="Фильтры">
                    🔍<span class="tab-tooltip">Фильтры</span>
                </button>
                <button class="sidebar-tab" data-panel="stats" title="Статистика">
                    📊<span class="tab-tooltip">Статистика</span>
                </button>
                <button class="sidebar-tab" data-panel="events" title="События">
                    📋<span class="tab-tooltip">События</span>
                </button>
                <button class="sidebar-tab" data-panel="links" title="Связи">
                    🔗<span class="tab-tooltip">Связи</span>
                </button>
                <button class="sidebar-tab" data-panel="projects" title="Проекты">
                    📁<span class="tab-tooltip">Проекты</span>
                </button>
                <button class="sidebar-tab" data-panel="data" title="Данные">
                    ⚙️<span class="tab-tooltip">Данные</span>
                </button>
            </nav>

            <!-- Панели контента -->
            <div class="sidebar-panels">

                <!-- ====== ВКЛАДКА: ФИЛЬТРЫ ====== -->
                <section class="sidebar-panel active" data-panel="filters">
                    <div class="panel">
                        <div class="panel-title">Фильтры</div>
                        <div class="filter-buttons" id="filter-types"></div>
                        <select id="filter-status" class="filter-status-select">
                            <option value="">Все статусы</option>
                        </select>
                        <button id="btn-clear-filters" class="btn-clear-filters">✕ Очистить все фильтры</button>
                        <div style="margin-top:8px;">
                            <div style="display:flex;gap:4px;">
                                <input type="date" id="filter-date-from" class="date-input" placeholder="С" style="flex:1;">
                                <input type="date" id="filter-date-to" class="date-input" placeholder="По" style="flex:1;">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- ====== ВКЛАДКА: СТАТИСТИКА ====== -->
                <section class="sidebar-panel" data-panel="stats">
                    <div class="panel">
                        <div class="panel-title">События по типам</div>
                        <div id="stats-types"></div>
                    </div>
                    <div class="panel">
                        <div class="panel-title">Распределение по времени</div>
                        <div id="timeline-container" class="timeline-container"></div>
                    </div>
                    <div class="panel">
                        <div class="panel-title">По статусу</div>
                        <div class="status-grid" id="stats-status"></div>
                    </div>
                </section>

                <!-- ====== ВКЛАДКА: СОБЫТИЯ ====== -->
                <section class="sidebar-panel" data-panel="events">
                    <div class="panel">
                        <div style="display:flex;gap:6px;margin-bottom:12px;">
                            <input type="text" id="event-search" placeholder="Поиск по событиям..." style="flex:1;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-md);font-size:12px;color:var(--text-input);">
                            <select id="event-sort" style="width:auto;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-md);font-size:12px;color:var(--text-input);cursor:pointer;">
                                <option value="date_desc">Дата ↓</option>
                                <option value="date_asc">Дата ↑</option>
                                <option value="status">По статусу</option>
                            </select>
                        </div>
                        <div id="event-list-panel" style="display:none;">
                            <div class="panel-title">
                                <span id="event-list-title">События</span>
                                <button id="btn-close-event-list" style="float:right;background:none;border:none;color:#64748b;cursor:pointer;font-size:16px;line-height:1;">✕</button>
                            </div>
                            <div id="event-list-container"></div>
                        </div>
                    </div>
                </section>

                <!-- ====== ВКЛАДКА: СВЯЗИ ====== -->
                <section class="sidebar-panel" data-panel="links">
                    <div class="panel">
                        <div class="panel-title">Связи между событиями</div>
                        <div id="links-list" style="max-height:400px;overflow-y:auto;"></div>
                        <div style="margin-top:12px;display:flex;gap:4px;flex-wrap:wrap;">
                            <button id="btn-export-links-json" style="flex:1;padding:6px;font-size:11px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);border-radius:var(--radius-md);cursor:pointer;">Экспорт JSON</button>
                            <button id="btn-export-links-csv" style="flex:1;padding:6px;font-size:11px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);border-radius:var(--radius-md);cursor:pointer;">Экспорт CSV</button>
                        </div>
                    </div>
                </section>

                <!-- ====== ВКЛАДКА: ПРОЕКТЫ ====== -->
                <section class="sidebar-panel" data-panel="projects">
                    <div class="panel">
                        <div class="panel-title">Проекты</div>
                        <button id="btn-new-project" style="width:100%;padding:8px;font-size:12px;background:var(--accent-blue);color:#fff;border:none;border-radius:var(--radius-md);cursor:pointer;margin-bottom:12px;">+ Новый проект</button>
                        <div id="projects-list" style="max-height:400px;overflow-y:auto;"></div>
                        <div style="margin-top:12px;">
                            <input type="file" id="file-import-project" accept=".json" style="display:none;">
                            <button id="btn-import-project" style="width:100%;padding:8px;font-size:12px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);border-radius:var(--radius-md);cursor:pointer;">Импорт проекта</button>
                        </div>
                    </div>
                </section>

                <!-- ====== ВКЛАДКА: ДАННЫЕ ====== -->
                <section class="sidebar-panel" data-panel="data">
                    <div class="panel">
                        <div class="panel-title">Экспорт событий</div>
                        <div style="display:flex;gap:4px;">
                            <button id="btn-export-json" style="flex:1;padding:8px;font-size:12px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);border-radius:var(--radius-md);cursor:pointer;">JSON</button>
                            <button id="btn-export-csv" style="flex:1;padding:8px;font-size:12px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);border-radius:var(--radius-md);cursor:pointer;">CSV</button>
                        </div>
                    </div>
                    <div class="panel">
                        <div class="panel-title">Импорт событий</div>
                        <button id="btn-import" style="width:100%;padding:8px;font-size:12px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);border-radius:var(--radius-md);cursor:pointer;">Import JSON</button>
                        <input type="file" id="file-import-json" accept=".json" style="display:none;">
                    </div>
                    <div class="panel">
                        <div class="panel-title">Валидация</div>
                        <button id="btn-validate" style="width:100%;padding:8px;font-size:12px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);border-radius:var(--radius-md);cursor:pointer;">Проверить данные</button>
                    </div>
                    <div class="panel">
                        <div class="panel-title">Категории</div>
                        <button id="btn-manage-categories" style="width:100%;padding:8px;font-size:12px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);border-radius:var(--radius-md);cursor:pointer;">+ Управление категориями</button>
                    </div>
                    <div class="panel">
                        <div class="panel-title">Статусы</div>
                        <button id="btn-manage-statuses" style="width:100%;padding:8px;font-size:12px;border:1px solid var(--border-default);background:transparent;color:var(--text-muted);border-radius:var(--radius-md);cursor:pointer;">+ Управление статусами</button>
                    </div>
                </section>

            </div>
        </aside>

        <!-- Карта -->
        <main class="map-container">
            <div id="map"></div>
            <div class="view-switch">
                <button class="view-btn active" data-mode="types">По типам</button>
                <button class="view-btn" data-mode="years">По годам</button>
                <button id="btn-link-mode" title="Режим связи">🔗</button>
                <button id="btn-heat-mode" class="view-btn" title="Тепловая карта">🔥</button>
            </div>
        </main>
    </div>

    <!-- Модалка добавления события -->
    <div id="modal-add" class="modal hidden">
        <div class="modal-content">
            <h2 class="modal-title">Новое событие</h2>
            <div class="form-group">
                <label>Тип</label>
                <select id="add-type">
                    <option value="personal">Личное</option>
                    <option value="traffic">Пробки</option>
                    <option value="roadwork">Ремонт</option>
                    <option value="safety">Безопасность</option>
                </select>
                <div class="field-error" id="error-type"></div>
            </div>
            <div class="form-group">
                <label>Источник</label>
                <input type="text" id="add-source" placeholder="Например: Яндекс, Дептранс, МВД">
                <div class="field-error" id="error-source"></div>
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="add-desc" placeholder="Что случилось?"></textarea>
                <div class="field-error" id="error-desc"></div>
            </div>
            <!-- Теги -->
            <div class="form-group">
                <label>Теги</label>
                <div class="tag-input-wrapper">
                    <div id="tag-chips" class="tag-chips"></div>
                    <input type="text" id="add-tags" placeholder="Введите тег и нажмите Enter">
                </div>
            </div>
            <!-- Дата и статус -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div class="form-group">
                    <label>Дата</label>
                    <input type="date" id="add-date">
                    <div class="field-error" id="error-date"></div>
                </div>
                <div class="form-group">
                    <label>Статус</label>
                    <select id="add-status">
                        <option value="planned">Запланировано</option>
                        <option value="in_progress">В процессе</option>
                        <option value="completed">Завершено</option>
                    </select>
                    <div class="field-error" id="error-status"></div>
                </div>
            </div>
            <!-- Координаты -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div class="form-group">
                    <label>Широта</label>
                    <input type="text" id="add-lat" value="55.7558" readonly>
                </div>
                <div class="form-group">
                    <label>Долгота</label>
                    <input type="text" id="add-lng" value="37.6173" readonly>
                </div>
            </div>
            <button id="btn-pick-from-map" class="btn-pick-map" type="button">📍 Выбрать на карте</button>
            <div class="modal-actions">
                <button id="modal-cancel" class="btn-cancel">Отмена</button>
                <button id="modal-submit" class="btn-primary">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Модалка управления категориями -->
    <div id="modal-categories" class="modal hidden">
        <div class="modal-content" style="max-width:400px;">
            <h2 class="modal-title">Категории</h2>
            <div id="categories-list" style="max-height:300px;overflow-y:auto;margin-bottom:16px;"></div>
            <div style="border-top:1px solid #252932;padding-top:16px;">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="cat-new-name" placeholder="Название категории">
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                    <div class="form-group">
                        <label>Цвет</label>
                        <input type="color" id="cat-new-color" value="#a855f7" style="height:36px;cursor:pointer;">
                    </div>
                    <div class="form-group" style="display:flex;align-items:flex-end;">
                        <button id="btn-add-category" class="btn-primary" style="width:100%;padding:8px;">Добавить</button>
                    </div>
                </div>
            </div>
            <div class="modal-actions" style="margin-top:16px;">
                <button id="modal-categories-cancel" class="btn-cancel">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Модалка управления статусами -->
    <div id="modal-statuses" class="modal hidden">
        <div class="modal-content" style="max-width:400px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h2 class="modal-title" style="margin:0;">Статусы</h2>
                <button id="btn-close-statuses" style="background:none;border:none;color:#64748b;cursor:pointer;font-size:20px;line-height:1;">✕</button>
            </div>
            <div id="statuses-list" style="max-height:300px;overflow-y:auto;margin-bottom:16px;"></div>
            <div style="border-top:1px solid #252932;padding-top:16px;">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="status-new-name" placeholder="Название статуса">
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                    <div class="form-group">
                        <label>Цвет</label>
                        <input type="color" id="status-new-color" value="#a855f7" style="height:36px;cursor:pointer;">
                    </div>
                    <div class="form-group" style="display:flex;align-items:flex-end;">
                        <button id="btn-add-status" class="btn-primary" style="width:100%;padding:8px;">Добавить</button>
                    </div>
                </div>
            </div>
            <div class="modal-actions" style="margin-top:16px;">
                <button id="modal-statuses-cancel" class="btn-cancel">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Модалка просмотра деталей события -->
    <div id="modal-event-detail" class="modal hidden">
        <div class="modal-content" style="max-width:480px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h2 class="modal-title" style="margin:0;">Детали события</h2>
                <button id="btn-close-detail" style="background:none;border:none;color:#64748b;cursor:pointer;font-size:20px;line-height:1;">✕</button>
            </div>
            <div id="event-detail-content"></div>
            <div class="modal-actions" style="margin-top:20px;">
                <button id="btn-delete-event" class="btn-delete" style="background:#ef4444;color:#fff;border:none;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;">Удалить</button>
                <button id="btn-close-event-detail" class="btn-cancel">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <!-- Собственные скрипты (порядок важен: config -> state -> utils -> data -> services -> components -> handlers -> app) -->
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/data/mock.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/components/map.js"></script>
    <script src="js/components/mapInit.js"></script>
    <script src="js/components/mapRender.js"></script>
    <script src="js/components/mapLabels.js"></script>
    <script src="js/components/mapYearClusters.js"></script>
    <script src="js/components/mapHeat.js"></script>
    <script src="js/components/mapNavigate.js"></script>
    <script src="js/components/ui.js"></script>
    <script src="js/components/uiCount.js"></script>
    <script src="js/components/uiFilters.js"></script>
    <script src="js/components/uiStatusFilter.js"></script>
    <script src="js/components/uiStatsTypes.js"></script>
    <script src="js/components/uiStatsStatus.js"></script>
    <script src="js/components/uiTimeline.js"></script>
    <script src="js/components/uiModal.js"></script>
    <script src="js/components/eventList.js"></script>
    <script src="js/components/eventListRender.js"></script>
    <script src="js/components/eventListActions.js"></script>
    <script src="js/components/eventListDetail.js"></script>
    <!-- handlers/statuses.js ДО eventListStatuses.js (handleAddStatus вызывает updateStatusSelect) -->
    <script src="js/handlers/statuses.js"></script>
    <script src="js/components/eventListStatuses.js"></script>
    <script src="js/components/eventListHandlers.js"></script>
    <script src="js/utils/export.js"></script>
    <!-- handlers: зависимости → оркестратор -->
    <script src="js/handlers/validation.js"></script>
    <script src="js/handlers/tags.js"></script>
    <script src="js/handlers/modal.js"></script>
    <script src="js/handlers/mapPick.js"></script>
    <script src="js/handlers/categories.js"></script>
    <script src="js/handlers/eventCreate.js"></script>
    <script src="js/handlers/events.js"></script>
    <script src="js/handlers/mapLinks.js"></script>
    <!-- sidebar tabs + новые панели — ПОСЛЕ mapLinks.js (зависят от savedLinks) -->
    <script src="js/components/sidebarTabs.js"></script>
    <script src="js/components/linksPanel.js"></script>
    <script src="js/components/projectsPanel.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
